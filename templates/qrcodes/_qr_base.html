{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <title>{% block title %}PlantCare{% endblock %}</title>

    <!-- Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Theme -->
    <link rel="stylesheet" href="{% static 'css/glassify.css' %}">
    <link rel="stylesheet" href="{% static 'css/qr.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body class="qr-body">

<!-- نوار بالا ساده -->
<header class="qr-topbar">
    <a href="{% url 'core:dashboard' %}" class="qr-brand">
        <i class="bi bi-flower1"></i>
        <span>PlantCare</span>
    </a>
    {% if not user.is_authenticated %}
        <a href="{% url 'accounts:login' %}" class="btn btn-sm btn-glass">
            <i class="bi bi-box-arrow-in-left"></i>
            ورود
        </a>
    {% else %}
        <a href="{% url 'core:dashboard' %}" class="btn btn-sm btn-glass">
            <i class="bi bi-speedometer2"></i>
            داشبورد
        </a>
    {% endif %}
</header>

<main class="qr-main">
    {% block content %}{% endblock %}
</main>

<footer class="qr-footer">
    <span>🌱 PlantCare — سامانه هوشمند مراقبت از گیاهان</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
